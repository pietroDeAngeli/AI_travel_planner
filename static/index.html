<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Travel Planner</title>
  <style>
    /* ── Reset & variables ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f172a;
      --surface:     #1e293b;
      --surface2:    #273548;
      --border:      #334155;
      --primary:     #0ea5e9;
      --primary-dim: #0369a1;
      --accent:      #14b8a6;
      --danger:      #f43f5e;
      --warn:        #f59e0b;
      --text:        #e2e8f0;
      --text-dim:    #94a3b8;
      --user-bubble: #0369a1;
      --bot-bubble:  #1e3a5f;
      --radius:      10px;
      --font:        'Segoe UI', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    /* Toggle switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }
    .toggle-wrap input[type="checkbox"] { display: none; }
    .toggle-track {
      width: 34px; height: 18px;
      background: var(--border);
      border-radius: 9px;
      position: relative;
      transition: background .2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
    }
    .toggle-wrap input:checked + .toggle-track { background: var(--primary); }
    .toggle-wrap input:checked + .toggle-track::after { transform: translateX(16px); }

    .btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-reset  { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-debug  { background: var(--primary); color: #fff; }

    /* ── Main layout ──────────────────────────────────────────────────── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat panel ───────────────────────────────────────────────────── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      border-right: 1px solid var(--border);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Scrollbar */
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 75%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }
    .msg-row.system { align-self: center; max-width: 90%; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .avatar.user { background: var(--primary-dim); }
    .avatar.bot  { background: var(--accent); }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 2px;
    }
    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 2px;
    }
    .msg-row.system .bubble {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      text-align: center;
    }
    .bubble.auto-queued {
      border-left: 3px solid var(--accent);
      background: #0f2e2a;
    }

    /* Loading dots */
    .typing { display: flex; gap: 4px; padding: 6px 2px; }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Input bar ────────────────────────────────────────────────────── */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      padding: 9px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color .15s;
    }
    #user-input:focus { border-color: var(--primary); }
    #user-input:disabled { opacity: .5; cursor: not-allowed; }

    #btn-send {
      padding: 9px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity .15s;
    }
    #btn-send:hover { opacity: .85; }
    #btn-send:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Debug panel ──────────────────────────────────────────────────── */
    .debug-panel {
      width: 380px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--surface);
      transition: width .25s ease, opacity .25s ease;
    }
    .debug-panel.hidden { width: 0; overflow: hidden; opacity: 0; }

    .debug-panel::-webkit-scrollbar { width: 5px; }
    .debug-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .debug-header {
      padding: 10px 14px 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .08em;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .debug-card {
      border-bottom: 1px solid var(--border);
    }

    .debug-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface);
      transition: background .1s;
    }
    .debug-card-header:hover { background: var(--surface2); }

    .debug-badge {
      font-size: 0.68rem;
      padding: 1px 7px;
      border-radius: 20px;
      margin-left: auto;
      font-weight: 700;
    }
    .badge-ok     { background: #14532d; color: #4ade80; }
    .badge-warn   { background: #431407; color: var(--warn); }
    .badge-info   { background: #1e3a5f; color: var(--primary); }
    .badge-none   { background: var(--surface2); color: var(--text-dim); }

    .chevron { font-size: 0.6rem; color: var(--text-dim); transition: transform .2s; }
    .debug-card.open .chevron { transform: rotate(90deg); }

    .debug-card-body {
      padding: 10px 14px 12px;
      font-size: 0.78rem;
      display: none;
      gap: 6px;
      flex-direction: column;
    }
    .debug-card.open .debug-card-body { display: flex; }

    .kv { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
    .kv-key {
      color: var(--text-dim);
      font-size: 0.72rem;
      min-width: 110px;
      flex-shrink: 0;
    }
    .kv-val {
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      word-break: break-all;
    }
    .kv-val.highlight { color: var(--accent); font-weight: 600; }
    .kv-val.action    { color: var(--warn);   font-weight: 600; }
    .kv-val.slot-filled { color: #4ade80; }
    .kv-val.slot-missing { color: var(--danger); }

    .debug-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 6px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      margin-top: 2px;
    }
    .slot-item {
      font-size: 0.73rem;
      display: flex;
      gap: 4px;
    }
    .slot-item .s-key { color: var(--text-dim); }
    .slot-item .s-val { color: #4ade80; font-family: monospace; }

    .pending-chip {
      display: inline-block;
      background: #2d1f00;
      color: var(--warn);
      border: 1px solid #854d0e;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-family: monospace;
      margin: 2px 0;
    }

    .api-result {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      margin-top: 4px;
    }
    .api-result .r-name { font-weight: 600; color: var(--text); font-size: 0.8rem; }
    .api-result .r-detail { color: var(--text-dim); font-size: 0.73rem; margin-top: 2px; }

    .error-box {
      background: #2d0a14;
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--danger);
      font-size: 0.75rem;
      font-family: monospace;
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .debug-panel { width: 100%; position: absolute; top: 48px; right: 0; height: calc(100% - 48px); z-index: 10; }
      .debug-panel.hidden { width: 0; }
    }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────────── -->
<header>
  <h1>✈️ AI Travel Planner</h1>

  <div class="header-controls">
    <label class="toggle-wrap" title="Enable/disable Intent Splitter">
      <input type="checkbox" id="toggle-splitter" checked />
      <div class="toggle-track"></div>
      Intent Splitter
    </label>

    <label class="toggle-wrap" title="Use LLM-based DM instead of rule-based">
      <input type="checkbox" id="toggle-llm-dm" checked />
      <div class="toggle-track"></div>
      LLM DM
    </label>

    <button class="btn btn-reset" id="btn-reset">New Chat</button>
    <button class="btn btn-debug" id="btn-debug">Debug Panel</button>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main>

  <!-- Chat -->
  <section class="chat-panel">
    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <input
        type="text"
        id="user-input"
        placeholder="Type your travel request…"
        autocomplete="off"
      />
      <button id="btn-send">Send</button>
    </div>
  </section>

  <!-- Debug sidebar -->
  <aside class="debug-panel" id="debug-panel">
    <div class="debug-header">Pipeline Internals</div>

    <!-- Intent Splitter -->
    <div class="debug-card open" id="card-splitter">
      <div class="debug-card-header" onclick="toggleCard(this)">
        <span>▶</span> Intent Splitter
        <span class="debug-badge badge-none" id="badge-splitter">—</span>
        <span class="chevron">▶</span>
      </div>
      <div class="debug-card-body" id="body-splitter">
        <span style="color:var(--text-dim);font-size:0.75rem">Waiting for first message…</span>
      </div>
    </div>

    <!-- NLU -->
    <div class="debug-card open" id="card-nlu">
      <div class="debug-card-header" onclick="toggleCard(this)">
        <span>🧠</span> NLU
        <span class="debug-badge badge-none" id="badge-nlu">—</span>
        <span class="chevron">▶</span>
      </div>
      <div class="debug-card-body" id="body-nlu">
        <span style="color:var(--text-dim);font-size:0.75rem">Waiting for first message…</span>
      </div>
    </div>

    <!-- DM -->
    <div class="debug-card open" id="card-dm">
      <div class="debug-card-header" onclick="toggleCard(this)">
        <span>🎯</span> Dialogue Manager
        <span class="debug-badge badge-none" id="badge-dm">—</span>
        <span class="chevron">▶</span>
      </div>
      <div class="debug-card-body" id="body-dm">
        <span style="color:var(--text-dim);font-size:0.75rem">Waiting for first message…</span>
      </div>
    </div>

    <!-- State -->
    <div class="debug-card open" id="card-state">
      <div class="debug-card-header" onclick="toggleCard(this)">
        <span>📋</span> Dialogue State
        <span class="debug-badge badge-none" id="badge-state">—</span>
        <span class="chevron">▶</span>
      </div>
      <div class="debug-card-body" id="body-state">
        <span style="color:var(--text-dim);font-size:0.75rem">Waiting for first message…</span>
      </div>
    </div>

    <!-- API -->
    <div class="debug-card" id="card-api">
      <div class="debug-card-header" onclick="toggleCard(this)">
        <span>🌐</span> API Results
        <span class="debug-badge badge-none" id="badge-api">—</span>
        <span class="chevron">▶</span>
      </div>
      <div class="debug-card-body" id="body-api">
        <span style="color:var(--text-dim);font-size:0.75rem">No API call made yet.</span>
      </div>
    </div>
  </aside>

</main>

<!-- ── Script ────────────────────────────────────────────────────────────── -->
<script>
"use strict";

const messagesEl  = document.getElementById("messages");
const inputEl     = document.getElementById("user-input");
const sendBtn     = document.getElementById("btn-send");
const resetBtn    = document.getElementById("btn-reset");
const debugToggle = document.getElementById("btn-debug");
const debugPanel  = document.getElementById("debug-panel");
const splitterChk = document.getElementById("toggle-splitter");
const llmDmChk    = document.getElementById("toggle-llm-dm");

let isWaiting = false;

// ── Initialise ──────────────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch("/init");
    const d = await r.json();
    appendBotMessage(d.greeting);
    splitterChk.checked = d.settings.use_splitter;
    llmDmChk.checked    = d.settings.use_llm_dm;
  } catch (e) {
    appendSystemMessage("Could not connect to backend. Make sure app.py is running.");
  }
}
init();

// ── Toggle helpers ───────────────────────────────────────────────────────────
function toggleCard(header) {
  header.closest(".debug-card").classList.toggle("open");
}

debugToggle.addEventListener("click", () => {
  debugPanel.classList.toggle("hidden");
  debugToggle.textContent = debugPanel.classList.contains("hidden")
    ? "Debug Panel" : "Hide Debug";
});

// ── Settings ────────────────────────────────────────────────────────────────
async function pushSettings() {
  await fetch("/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      use_splitter: splitterChk.checked,
      use_llm_dm:   llmDmChk.checked,
    }),
  });
}
splitterChk.addEventListener("change", pushSettings);
llmDmChk.addEventListener("change",    pushSettings);

// ── Reset ────────────────────────────────────────────────────────────────────
resetBtn.addEventListener("click", async () => {
  messagesEl.innerHTML = "";
  clearDebugPanels();
  const r = await fetch("/reset", { method: "POST" });
  const d = await r.json();
  appendBotMessage(d.greeting);
});

// ── Send message ─────────────────────────────────────────────────────────────
sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(overrideText = null, skipSplit = false) {
  const text = (overrideText ?? inputEl.value).trim();
  if (!text || isWaiting) return;

  inputEl.value = "";
  setWaiting(true);

  if (!skipSplit) {
    appendUserMessage(text);
  }

  const typingEl = appendTypingIndicator();

  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, skip_split: skipSplit }),
    });
    const data = await r.json();
    typingEl.remove();

    if (data.error) {
      appendSystemMessage("Error: " + data.error);
    } else {
      appendBotMessage(data.response, skipSplit);
      updateDebugPanel(data.debug);

      if (data.done) {
        setWaiting(false);
        inputEl.disabled = true;
        sendBtn.disabled = true;
        appendSystemMessage("Conversation ended. Click 'New Chat' to start again.");
        return;
      }

      // Auto-process queued intent
      if (data.next_queued) {
        setWaiting(false);
        appendSystemMessage(`Auto-processing queued intent: "${data.next_queued}"`);
        setTimeout(() => sendMessage(data.next_queued, true), 1200);
        return;
      }
    }
  } catch (e) {
    typingEl.remove();
    appendSystemMessage("Network error. Is the server running?");
  }

  setWaiting(false);
}

// ── Message rendering ─────────────────────────────────────────────────────────
function appendUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `
    <div class="avatar user">You</div>
    <div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function appendBotMessage(text, isAutoQueued = false) {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.innerHTML = `
    <div class="avatar bot">AI</div>
    <div class="bubble ${isAutoQueued ? 'auto-queued' : ''}">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function appendSystemMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row system";
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function appendTypingIndicator() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.innerHTML = `
    <div class="avatar bot">AI</div>
    <div class="bubble">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
  return row;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── Waiting state ─────────────────────────────────────────────────────────────
function setWaiting(val) {
  isWaiting = val;
  inputEl.disabled = val;
  sendBtn.disabled = val;
  sendBtn.textContent = val ? "…" : "Send";
}

// ── Debug panel update ────────────────────────────────────────────────────────
function clearDebugPanels() {
  const placeholder = `<span style="color:var(--text-dim);font-size:0.75rem">Waiting for first message…</span>`;
  ["body-splitter","body-nlu","body-dm","body-state","body-api"].forEach(id => {
    document.getElementById(id).innerHTML = placeholder;
  });
  ["badge-splitter","badge-nlu","badge-dm","badge-state","badge-api"].forEach(id => {
    const el = document.getElementById(id);
    el.className = "debug-badge badge-none";
    el.textContent = "—";
  });
}

function updateDebugPanel(debug) {
  if (!debug) return;

  // ── Splitter ──────────────────────────────────────────────────────────────
  if (debug.splitter) {
    const s = debug.splitter;
    const badge = document.getElementById("badge-splitter");
    const body  = document.getElementById("body-splitter");

    if (s.triggered) {
      badge.className = "debug-badge badge-warn";
      badge.textContent = `${(s.queued || []).length + 1} intents`;
    } else {
      badge.className = "debug-badge badge-none";
      badge.textContent = "1 intent";
    }

    let html = kv("Input sent to NLU", `<span class="kv-val highlight">${escapeHtml(s.current)}</span>`);
    html += kv("Split triggered", s.triggered
      ? `<span class="kv-val" style="color:var(--warn)">Yes</span>`
      : `<span class="kv-val" style="color:var(--text-dim)">No</span>`);

    if (s.reason) {
      html += kv("Reason", `<span class="kv-val" style="color:var(--text-dim)">${s.reason}</span>`);
    }

    if (s.triggered && s.queued && s.queued.length) {
      html += `<div class="debug-section-title" style="margin-top:6px">Queued intents</div>`;
      s.queued.forEach((q, i) => {
        html += `<div class="pending-chip">${i + 1}. ${escapeHtml(q)}</div>`;
      });
    }
    body.innerHTML = html;
  }

  // ── NLU ───────────────────────────────────────────────────────────────────
  if (debug.nlu) {
    const n = debug.nlu;
    const badge = document.getElementById("badge-nlu");
    const body  = document.getElementById("body-nlu");

    badge.className = "debug-badge badge-ok";
    badge.textContent = n.intent || "OOD";

    const groundingColors = {
      base:         "var(--text-dim)",
      confirmation: "var(--warn)",
      slot_change:  "var(--primary)",
    };
    const gc = groundingColors[n.grounding_mode] || "var(--text-dim)";

    let html = kv("Classified intent",
      `<span class="kv-val highlight">${escapeHtml(n.intent || "—")}</span>`);
    html += kv("Grounding mode",
      `<span class="kv-val" style="color:${gc}">${n.grounding_mode}</span>`);

    const slots = n.slots || {};
    const slotKeys = Object.keys(slots);
    if (slotKeys.length > 0) {
      html += `<div class="debug-section-title" style="margin-top:6px">Extracted slots</div>`;
      html += `<div class="slot-grid">`;
      slotKeys.forEach(k => {
        html += `<div class="slot-item">
          <span class="s-key">${escapeHtml(k)}:</span>
          <span class="s-val">${escapeHtml(String(slots[k]))}</span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += kv("Slots", `<span class="kv-val" style="color:var(--text-dim)">none</span>`);
    }
    body.innerHTML = html;
  }

  // ── DM ────────────────────────────────────────────────────────────────────
  if (debug.dm) {
    const d = debug.dm;
    const badge = document.getElementById("badge-dm");
    const body  = document.getElementById("body-dm");

    badge.className = "debug-badge badge-warn";
    badge.textContent = d.base_action || d.action;

    let html = kv("Action",
      `<span class="kv-val action">${escapeHtml(d.action || "—")}</span>`);
    if (d.slot_param) {
      html += kv("Slot param",
        `<span class="kv-val highlight">${escapeHtml(String(d.slot_param))}</span>`);
    }
    body.innerHTML = html;
  }

  // ── State ─────────────────────────────────────────────────────────────────
  if (debug.state) {
    const st = debug.state;
    const badge = document.getElementById("badge-state");
    const body  = document.getElementById("body-state");

    badge.className = "debug-badge badge-info";
    badge.textContent = st.current_intent || "idle";

    let html = kv("Current intent",
      `<span class="kv-val highlight">${escapeHtml(st.current_intent || "—")}</span>`);
    html += kv("Last action",
      `<span class="kv-val action">${escapeHtml(st.last_action || "—")}</span>`);
    html += kv("Confirmed",
      `<span class="kv-val" style="color:${st.confirmed ? '#4ade80' : 'var(--text-dim)'}">${st.confirmed}</span>`);

    if (st.awaiting_carryover) {
      html += kv("Awaiting carryover",
        `<span class="kv-val" style="color:var(--warn)">true</span>`);
    }

    if (st.completed_intents && st.completed_intents.length) {
      html += kv("Completed",
        `<span class="kv-val" style="color:#4ade80">${escapeHtml(st.completed_intents.join(", "))}</span>`);
    }

    // Booking data
    const bookingKeys = ["flight", "accommodation", "activity", "compare_cities"];
    bookingKeys.forEach(bk => {
      if (st[bk]) {
        html += `<div class="debug-section-title" style="margin-top:8px">${bk.replace("_", " ")}</div>`;
        html += `<div class="slot-grid">`;
        Object.entries(st[bk]).forEach(([k, v]) => {
          html += `<div class="slot-item">
            <span class="s-key">${escapeHtml(k)}:</span>
            <span class="s-val">${escapeHtml(String(v))}</span>
          </div>`;
        });
        html += `</div>`;
      }
    });

    body.innerHTML = html;
  }

  // ── API ───────────────────────────────────────────────────────────────────
  {
    const apiDebug = debug.api;
    const badge = document.getElementById("badge-api");
    const body  = document.getElementById("body-api");
    // Auto-open card if there's API data
    const card = document.getElementById("card-api");

    if (apiDebug) {
      card.classList.add("open");
      if (apiDebug.error) {
        badge.className = "debug-badge badge-warn";
        badge.textContent = "error";
        body.innerHTML = `<div class="error-box">${escapeHtml(apiDebug.error)}</div>`;
      } else if (apiDebug.results) {
        const results = Array.isArray(apiDebug.results)
          ? apiDebug.results
          : [apiDebug.results];
        badge.className = "debug-badge badge-ok";
        badge.textContent = `${results.length} result${results.length !== 1 ? "s" : ""}`;
        let html = "";
        results.forEach(r => {
          if (typeof r === "object" && r !== null) {
            html += `<div class="api-result">
              <div class="r-name">${escapeHtml(r.name || "Option")}</div>`;
            Object.entries(r).forEach(([k, v]) => {
              if (k !== "name") {
                html += `<div class="r-detail"><b>${escapeHtml(k)}:</b> ${escapeHtml(String(v))}</div>`;
              }
            });
            html += `</div>`;
          } else {
            html += `<div class="api-result"><div class="r-name">${escapeHtml(String(r))}</div></div>`;
          }
        });
        body.innerHTML = html;
      }
    } else {
      badge.className = "debug-badge badge-none";
      badge.textContent = "—";
      body.innerHTML = `<span style="color:var(--text-dim);font-size:0.75rem">No API call this turn.</span>`;
    }
  }
}

// ── Utility ───────────────────────────────────────────────────────────────────
function kv(key, valueHtml) {
  return `<div class="kv">
    <span class="kv-key">${escapeHtml(key)}</span>
    ${valueHtml}
  </div>`;
}
</script>

</body>
</html>
